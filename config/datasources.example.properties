compare.datasources.mysql-ds.url=jdbc:mysql://localhost:3306/example
compare.datasources.mysql-ds.username=${MYSQL_USER:reader}
compare.datasources.mysql-ds.password=${MYSQL_PASSWORD:}
compare.datasources.mysql-ds.driver-class-name=com.mysql.cj.jdbc.Driver
compare.datasources.mysql-ds.read-only=true
compare.datasources.mysql-ds.prod=false

compare.datasources.postgres-ds.url=jdbc:postgresql://localhost:5432/example
compare.datasources.postgres-ds.username=${PG_USER:reader}
compare.datasources.postgres-ds.password=${PG_PASSWORD:}
compare.datasources.postgres-ds.driver-class-name=org.postgresql.Driver
compare.datasources.postgres-ds.read-only=true
compare.datasources.postgres-ds.prod=false
