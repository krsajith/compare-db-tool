spring.application.name=compare-db-tool
spring.config.import=optional:file:./config/datasources.properties,optional:file:./config/logging.properties
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.config=classpath:logback-spring.xml
logging.file.path=logs
logging.level.root=INFO
logging.level.com.taomish.comparedbtool=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.org.postgresql=WARN
logging.level.com.mysql.cj=WARN
